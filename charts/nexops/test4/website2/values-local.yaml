

############# k8s deployments values #############
k8sdeployments:
  replicaCount: 1
  revisionHistoryLimit: 5
  environment: local

  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

  image:
    name: "hub.nexdev.net/nexops/test4_website2:LOCAL-12342071"
    pullPolicy: Always
    pullSecretName: argocd-regcred-secret

  healthCheck:
    enabled: true
    path: /
    failureThreshold: 5
    periodSeconds: 5
    timeoutSeconds: 5
    startupFailureThreshold: 30

  configFile:
    path: "/app/."
    name: "appsettings.json"    
    content: |
      {
        "Logging": {
          "LogLevel": {
            "Default": "Information",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information"
          }
        },
        "AllowedHosts": "*"
      }



  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
    port: 5000
    targetPort: 5000
  #  nodePort:




  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 16Mi

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector:
    web: "yes"

  tolerations:
    - key: web
      operator: "Equal"
      value: "yes"
      effect: "NoSchedule"

  affinity: {}

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000