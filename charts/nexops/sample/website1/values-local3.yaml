

############# k8s deployments values #############
k8sdeployments:
  replicaCount: 1
  revisionHistoryLimit: 5
  environment: local3

  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

  image:
    name: "hub.nexdev.net/nexops/sample_website1:LOCAL_3-97f8e30e"
    pullPolicy: Always

  healthCheck:
    enabled: true
    path: /
    failureThreshold: 5
    periodSeconds: 5
    timeoutSeconds: 5
    startupFailureThreshold: 30

  configFile:
    path: "/app/."
    name: "appsettings.json"    
    content: |
      {
        "Logging": {
          "LogLevel": {
            "Default": "Information",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information"
          }
        },
        "AllowedHosts": "*",
        "AppSettings": {
          "SentryDsn": "http://d50bf7256dfd46219cd4f51e0d34e3b5@10.18.200.131:800/103",
          "SentryEnvironment": "NexOps.Sample"
        }
      }

  spFile:
    path: "/app/App_Data"
    name: "SpNames.xml"    


  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
    port: 5000
    targetPort: 5000
  #  nodePort:

  ingress:
    enabled: true
    stickySessions: false
    className: haproxy
    hosts:
      - host: sample1.nexdev.net
        paths:
          - path: /
            pathType: Prefix



  resources:
    limits:
      memory: 2048Mi
    requests:
      memory: 16Mi

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector:
    web: "yes"

  tolerations:
    - key: web
      operator: "Equal"
      value: "yes"
      effect: "NoSchedule"

  affinity: {}

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000