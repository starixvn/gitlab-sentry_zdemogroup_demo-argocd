

############# k8s deployments values #############
k8sdeployments:
  replicaCount: 1
  revisionHistoryLimit: 5
  environment: sit3

  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

  image:
    name: "hub.nexdev.net/nexops/sample_website1:SIT_3-e23f881c"
    pullPolicy: Always

  healthCheck:
    enabled: true
    path: /
    failureThreshold: 5
    periodSeconds: 5
    timeoutSeconds: 5
    startupFailureThreshold: 30

  configFile:
    path: "/app/."
    name: "appsettings.json"    
    content: |
      
      {
        "Logging": {
          "LogLevel": {
            "Default": "Information",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information"
          }
        },
        "AllowedHosts": "*",
        "AppSettings": {
          "SentryDsn": "http://bdece1b0d9b44fc7b9754b75b00d53a5@172.16.2.44:800/64",
          "SentryEnvironment": "NexOps.Sample"
        }
      }

  spFile:
    path: "/app/App_Data"
    name: "SpNames.xml"    
    content: |
      
      <?xml version="1.0" encoding="utf-8" ?>
      <Functions>
        <Function Name="Admin">
          <Setting Key="Site_Insert" SpName="Site_Insert" DbName="NexOps.Up_DeploymentTest.abc" Plain="0" />    
        </Function>  
      </Functions>


  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
    port: 5000
    targetPort: 5000
  #  nodePort:




  resources:
    limits:
      memory: 2048Mi
    requests:
      memory: 16Mi

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector:
    web: "yes"

  tolerations:
    - key: web
      operator: "Equal"
      value: "yes"
      effect: "NoSchedule"

  affinity: {}

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000