imagepullsecrets:
  imageCredentials:
    registry: "oci://hub.nexdev.net/charts"
    username: "gitlab-ci"
    password: "H5nF5ywy262wt881ZWpq"

k8sdeployments:
  ############# k8s deployments values #############
  replicaCount: 2
  revisionHistoryLimit: 5
  environment: local2
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0
  image:
    name: "hub.nexdev.net/nexops/sample_website2:LOCAL_2-e06ed9db"
    pullPolicy: Always
  healthCheck:
    enabled: true
    path: /
    failureThreshold: 5
    periodSeconds: 5
    timeoutSeconds: 5
    startupFailureThreshold: 30
  configFile:
    path: "/app/."
    name: "appsettings.json"    
    content: |
      {
        "Logging": {
          "LogLevel": {
            "Default": "Information",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information"
          }
        }
      }
  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
    port: 5000
    targetPort: 5000
  #  nodePort:
  ingress:
    enabled: true
    stickySessions: false
    className: haproxy
    hosts:
      - host: sample-website2.nexdev.net
        paths:
          - path: /main
            pathType: Prefix
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 16Mi
  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  # nodeSelector:
  #   api: "yes"
  # tolerations:
  #   - key: api
  #     operator: "Equal"
  #     value: "yes"
  #     effect: "NoSchedule"
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000