{{- $pvcName := nospace (cat .Release.Name "-pvc") }}
{{- $environment := .Values.environment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      hostname: {{ .Release.Name }}-k8s
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Release.Name }}-serviceaccount
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        - name: {{ .Release.Name }}-{{ .Values.image.pullSecretName }}
      containers:
        - name: {{ .Release.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.image.name }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: liveness-port
              containerPort: {{ .Values.service.port }}
          {{- with .Values.healthCheck }}
            {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: liveness-port
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: liveness-port
            failureThreshold: {{ .failureThreshold }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: liveness-port
            failureThreshold: {{ .startupFailureThreshold }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}          
          volumeMounts:
          {{- if .Values.configFile }}
            - name: {{ .Release.Name }}-config
              mountPath: {{ .Values.configFile.path }}/{{ .Values.configFile.name }}
              subPath: {{ .Values.configFile.name }}
              readOnly: true
          {{- end }}
          {{- if .Values.spFile }}
            - name: {{ .Release.Name }}-sp-config
              mountPath: {{ .Values.spFile.path }}/{{ .Values.spFile.name }}
              subPath: {{ .Values.spFile.name }}
              readOnly: true
          {{- end }}
          {{- range .Values.volumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
          {{- end }}

      volumes:
      {{- if .Values.configFile }}
        - name: {{ .Release.Name }}-config
          configMap:
            name: {{ .Release.Name }}-configmap
            items:
              - key: {{ .Values.configFile.name }}
                path: {{ .Values.configFile.name }}
      {{- end }}
      {{- if .Values.spFile }}
        - name: {{ .Release.Name }}-sp-config
          configMap:
            name: {{ .Release.Name }}-configmap
            items:             
              - key: {{ .Values.spFile.name }}
                path: {{ .Values.spFile.name }}
      {{- end }}
      {{- range .Values.volumes }}
        - name: {{ .name }}
          persistentVolumeClaim:
          {{- if .sharedPVC }}
            claimName: "{{ .sharedPVC }}-{{ $environment }}-pvc"
          {{- else }}
            claimName: {{ $pvcName }}
          {{- end }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
