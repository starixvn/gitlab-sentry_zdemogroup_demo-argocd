{{- if .Values.ingress.enabled }}
{{- $svcName := nospace (cat .Release.Name "-service") }}
{{- $svcPort := .Values.service.port }}
{{- $cookieName := nospace (cat .Release.Name "-cookie") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app.kubernetes.io/managed-by: Helm
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | default "default" | quote }}
  {{- if eq .Values.ingress.className "haproxy" }}
    {{- if .Values.healthCheck.enabled }}
    haproxy.org/check: "true"
    haproxy.org/check-http: {{ (cat "GET" .Values.healthCheck.path) | quote }}
    haproxy.org/check-interval: "5s"
    haproxy.org/timeout-check: "5s"
    {{- end }}
    haproxy.org/forwarded-for: "true"
    {{- if .Values.ingress.stickySessions }}
    haproxy.org/cookie-persistence: {{ $cookieName }}
    {{- end }}
    {{- if .Values.ingress.timeoutServer }}
    haproxy.org/timeout-server: {{ .Values.ingress.timeoutServer }}
    {{- end }}

    {{- range .Values.ingress.hosts }}
    {{- range .paths }}
      {{- if ne "/" .path }}
    haproxy.org/path-rewrite: {{.path}}/?(.*) /\1
      {{- end }}
    {{- end }}
    {{- end }}
  {{- else if eq .Values.ingress.className "nginx" }}
    {{- if .Values.ingress.timeoutServer }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.ingress.timeoutServer | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.timeoutServer | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.timeoutServer | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:              
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
