apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
spec:
{{- with .Values.service }}
  type: {{ .type }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
  {{- if and (eq .type "NodePort") .nodePort }}
      nodePort: {{ .nodePort }}
  {{- end }}
{{- end }}
  selector:
    app: {{ .Release.Name }}
