# Default values for k8sdeployments.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
revisionHistoryLimit: 5

rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 0

image:
  name: ""
  pullPolicy: IfNotPresent
  pullSecretName: regcred-secret

healthCheck:
  enabled: false
  path: /
  failureThreshold: 5
  periodSeconds: 5
  timeoutSeconds: 5
  startupFailureThreshold: 30

configFile: {}
# Using configMap for app config
#  path: .
#  name: ""
#  content: ""

spFile: {}
# Using configMap for sp config
#  path: .
#  name: ""
#  content: ""

env: []
#  - name: GREETING
#    value: "Warm greetings to"

service:
# kind of types: ClusterIP, NodePort, LoadBalancer
  type: ClusterIP
  port: 5000
  targetPort: 5000
#  nodePort:

ingress:
  enabled: false
  stickySessions: false
  className: "haproxy"
#  timeoutServer: 1m
#  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts: []
  #  - host: chart-example.local
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

pvc:
  create: false
  storageClassName: longhorn-rwx
#  storage: 512Mi

volumes: []
#  - name: a
#    mountPath: /mnt/a
#    sharedPVC: data

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
