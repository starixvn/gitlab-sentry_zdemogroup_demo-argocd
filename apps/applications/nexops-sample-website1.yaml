apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexops-sample-website1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: mason
    path: teams/nexops/sample/website1
  destination:
    server: https://kubernetes.default.svc
    namespace: sample
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 