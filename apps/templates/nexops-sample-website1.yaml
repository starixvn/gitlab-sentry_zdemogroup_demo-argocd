{{- range .Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexops-sample-website1-{{ .name }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $.Values.spec.source.repoURL }}
    targetRevision: {{ $.Values.spec.source.targetRevision }}
    path: teams/nexops/sample/website1
    helm:
      valueFiles:
        - values-{{ .name }}.yaml
  destination:
    server: {{ $.Values.spec.destination.server }}
    namespace: sample
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }} 