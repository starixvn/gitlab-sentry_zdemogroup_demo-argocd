apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexops-sample-website1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: teams/nexops/sample/website1
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: sample
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 