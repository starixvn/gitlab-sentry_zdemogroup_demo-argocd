apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nexops-sample-website1
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: prod
            valuesFile: values-prod.yaml
            namespace: sample-prod
            path: teams/nexops/sample/website1
          - env: local
            valuesFile: values-local.yaml
            namespace: sample-local
            path: teams/nexops/sample/website1
  template:
    metadata:
      name: 'nexops-sample-website1-{{env}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
        targetRevision: mason
        path: '{{path}}'
        helm:
          valueFiles:
            - '{{path}}/values.yaml'
            - '{{path}}/{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true 