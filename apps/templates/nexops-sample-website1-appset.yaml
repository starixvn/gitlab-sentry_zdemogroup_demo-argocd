apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nexops-sample-website1
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: prod
            path: teams/nexops/sample/website1
          - env: local
            path: teams/nexops/sample/website1
  template:
    metadata:
      name: 'nexops-sample-website1-{{.env}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
        targetRevision: mason
        path: '{{.path}}'
        helm:
          valueFiles:
            - '{{.path}}/values.yaml'
            - '{{.path}}/values-{{.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: sample
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true 