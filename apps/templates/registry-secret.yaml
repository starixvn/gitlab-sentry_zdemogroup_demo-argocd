apiVersion: v1
kind: Secret
metadata:
  name: hub-nexdev-registry-secret
  namespace: sample
  labels:
    argocd.argoproj.io/secret-type: repository
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "hub.nexdev.net": {
          "auth": "{{ .Values.spec.registry.auth }}"
        }
      }
    } 