{{- range $app := .Values.applications }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hub-nexdev-registry-secret
  namespace: {{ $app.namespace }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "hub.nexdev.net": {
          "auth": "{{ $.Values.spec.registry.auth }}"
        }
      }
    }
{{- end }}