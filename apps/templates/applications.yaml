{{- range .Values.applications }}
{{- range .environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.name }}-{{ .name }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $.Values.spec.source.repoURL }}
    targetRevision: {{ $.Values.spec.source.targetRevision }}
    path: {{ $.path }}
    helm:
      values: |
        image:
          tag: {{ .image.tag }}
  destination:
    server: {{ $.Values.spec.destination.server }}
    namespace: {{ $.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }} 