apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ../../../../../charts

helmCharts:
  - name: common-app
    releaseName: sample-website1
    version: 0.1.0
    valuesFile: values.yaml

patches:
  - target:
      kind: Deployment
      name: sample-website1-common-app
    path: patch.yaml