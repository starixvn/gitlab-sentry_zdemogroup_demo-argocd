apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample_website1_LOCAL2
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: sample
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/nexops/sample/website1
    repoURL: gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: mason
    helm:
      valueFiles:
        - values_LOCAL2.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true