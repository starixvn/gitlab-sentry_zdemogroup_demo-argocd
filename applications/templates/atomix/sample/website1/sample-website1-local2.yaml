apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-website1-local2
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    environment: local2
    app: website1
spec:
  destination:
    namespace: sample
    server: https://kubernetes.default.svc
  project: default
  source:
    path: charts/atomix/sample/website1
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    helm:
      valueFiles:
        - values-local2.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 