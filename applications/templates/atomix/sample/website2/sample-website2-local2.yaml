apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-website2-local2
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    environment: local2
    app: website2
spec:
  destination:
    namespace: sample
    name: local
  project: default
  source:
    path: charts/atomix/sample/website2
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-local2.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 