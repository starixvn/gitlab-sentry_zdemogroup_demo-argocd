apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-website1-sit1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: sample-website1
spec:
  destination:
    namespace: sample
    name: sit
  project: default
  source:
    path: charts/nexops/sample/website1
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-sit1.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true