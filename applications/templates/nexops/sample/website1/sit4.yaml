apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-website1-sit4
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: sample-website1
spec:
  destination:
    namespace: sample
    name: k8s-starix-local
  project: rocketor
  source:
    path: charts/nexops/sample/website1
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-sit4.yaml