apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample1-website1-test-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: sample1-website1-test
spec:
  destination:
    namespace: sample1
    name: k8s-starix-local
  project: rocketor
  source:
    path: charts/nexops/sample1/website1_test
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-local.yaml