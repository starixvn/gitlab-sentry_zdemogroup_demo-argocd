apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample2-website2-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: sample2-website2
spec:
  destination:
    namespace: sample2
    name: k8s-starix-local
  project: rocketor
  source:
    path: charts/nexops/sample2/website2
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-local.yaml