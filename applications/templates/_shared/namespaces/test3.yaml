apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test3-namespace
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: test3-namespace
spec:
  destination:
    namespace: test3
    name: local
  project: default
  source:
    path: charts/_shared/namespaces/test3
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main