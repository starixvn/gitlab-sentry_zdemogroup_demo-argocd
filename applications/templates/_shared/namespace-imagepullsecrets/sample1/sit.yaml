apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample1-namespace-imagepullsecrets-sit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: sample1-namespace-imagepullsecrets
spec:
  destination:
    namespace: sample1
    name: k8s-starix-local
  project: rocketor
  source:
    path: charts/_shared/namespace-imagepullsecrets/sample1
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-sit.yaml