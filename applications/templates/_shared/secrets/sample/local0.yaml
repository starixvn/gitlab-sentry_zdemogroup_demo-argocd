apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-imagepullsecrets-local0
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: sample-imagepullsecrets
spec:
  destination:
    namespace: sample
    name: local
  project: default
  source:
    path: charts/_shared/secrets/sample
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-local0.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=true