apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test2-imagepullsecrets-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: test2-imagepullsecrets
spec:
  destination:
    namespace: test2
    name: local
  project: default
  source:
    path: charts/_shared/secrets/test2
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-local.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true