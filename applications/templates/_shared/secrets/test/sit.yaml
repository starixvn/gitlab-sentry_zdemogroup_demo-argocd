apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-imagepullsecrets-sit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: test-imagepullsecrets
spec:
  destination:
    namespace: test
    name: 
  project: default
  source:
    path: charts/_shared/secrets/test
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-sit.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true