apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test4-imagepullsecrets-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: test4-imagepullsecrets
spec:
  destination:
    namespace: test4
    name: local
  project: default
  source:
    path: charts/_shared/secrets/test4
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: main
    helm:
      valueFiles:
        - values-local.yaml