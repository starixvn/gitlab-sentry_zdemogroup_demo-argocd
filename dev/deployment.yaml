apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-website1
spec:
  selector:
    matchLabels:
      app: sample-website1
  replicas: 2
  template:
    metadata:
      labels:
        app: sample-website1
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: sample-website1
        image: hub.nexdev.net/nexops/sample_website1:LOCAL-67dc7831
        ports:
        - containerPort: 5000
