{{- range $ns := .Values.namespaces }}
{{- range $app := $ns.applications }}
{{- range $env := $app.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $ns.name }}-{{ $app.name }}-{{ $env.name }}
  namespace: argocd
  labels:
    team: {{ $ns.team }}
    namespace: {{ $ns.name }}
    environment: {{ $env.name }}
spec:
  project: default
  source:
    repoURL: {{ $.Values.spec.source.repoURL }}
    targetRevision: {{ $.Values.spec.source.targetRevision }}
    path: {{ $app.path }}
    helm:
      values: |
        {{- if $env.values }}
        {{- toYaml $env.values | nindent 8 }}
        {{- end }}
  destination:
    server: {{ $.Values.spec.destination.server }}
    namespace: {{ $ns.name }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
{{- end }}