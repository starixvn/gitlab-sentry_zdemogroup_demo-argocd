apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: mason
    path: dev
  destination:
    namespace: demo-argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.nexdev.net/gitlab-sentry/zdemogroup/demo-argocd.git
    targetRevision: mason
    path: demo-app
    helm:
      releaseName: demo-app
      valueFiles:
        - values.yaml
  destination:
    namespace: demo-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
